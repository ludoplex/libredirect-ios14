# Generated by ci-kit/repo_ci_init.py (script-protocol) - CI-PROTOCOL baseline.
# Re-run repo_ci_init.py to refresh; edit freely afterwards but keep the checked properties
# (permissions, pinned actions, push+pull_request triggers, concurrency, timeouts, dependabot).
# Fork edits (2026-11-09): test job runs in ios14/ (root is upstream's pnpm project without an
# npm lockfile); pages job publishes ios14/dist to GitHub Pages from the ios14 branch.
name: ci

on:
  push:
    branches: [ios14, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-standard:
    name: CI-PROTOCOL self-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository meets the CI/CD baseline
        run: python3 .github/ci-kit/repo_ci_check.py .

  test:
    name: iOS 14 build, compat lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/ios14'
        with:
          path: ios14/dist

  pages:
    name: deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/ios14'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
